name: Build Linux AppImage
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - run: bash build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RoyaltyFreeInspector-AppImage
          path: RoyaltyFreeInspector-x86_64.AppImage
